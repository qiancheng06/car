yolo_vision:
  ros__parameters:
    image_topic: /image_raw
    # CPU-safe baseline. NPU deployment can later replace only the backend.
    imgsz: 640
    inference_rate_hz: 2.0
    device: cpu
    torch_threads: 4
    base_confidence: 0.25
    iou_threshold: 0.55
    max_detections: 80

    # Per-class gates. Re-tune with footage from the installed USB camera.
    parking_confidence: 0.65
    red_light_confidence: 0.65
    cone_confidence: 0.45
    parking_min_area_ratio: 0.0008
    red_light_min_area_ratio: 0.0003
    red_light_roi_top_ratio: 0.0
    red_light_roi_bottom_ratio: 0.80

    # Temporal confirmation prevents a one-frame false positive from changing state.
    red_window: 5
    red_min_hits: 3
    red_clear_frames: 3
    parking_window: 7
    parking_min_votes: 4

    cone_min_color_ratio: 0.02
    cone_color_dominance: 1.25
    publish_debug_image: false
    log_interval_s: 5.0
